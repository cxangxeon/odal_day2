<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>부산 맛집 & 경로 안내 서비스</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- 실제 발급받은 Kakao JS 키로 대체 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=dd6ddec0eaca2fe52c400163074fb95e&libraries=services"></script>
</head>
<body>
 
  <div class="container">
    <h1>부산 맛집 & 경로 안내</h1>

    <!-- 출발지 설정 -->
    <div class="section">
      <label for="originAddress">출발지:</label>
      <span class="origin-wrap">
        <input type="text" id="originAddress" autocomplete="off" placeholder="대충 입력해도 돼요 (예: 부산대 앞, 서면역, 학장동)" />
        <ul id="originSuggest" class="origin-suggest"></ul>
      </span>
      <button id="setOriginBtn">출발지 설정</button>
      <button id="useLocationBtn" title="브라우저의 현재 위치 사용">📍 현재 위치</button>
      <span id="originStatus" style="margin-left:6px; font-size:13px;"></span>
      <!-- 주변 맛집 자동 조회 또는 수동 조회 버튼 -->
      <button id="showRestaurantsBtn">주변 맛집 보기</button>
      <span id="instruction" style="margin-left: 10px; color: #555;">
        맛집 마커를 클릭하면 도착지로 설정되어 경로를 안내합니다.
      </span>
    </div>

    <!-- 음식 종류/가격대 필터 -->
    <div class="section">
      <label for="categorySelect">음식 종류:</label>
      <select id="categorySelect">
        <option value="">전체</option>
        <option value="한식">한식</option>
        <option value="중식">중식</option>
        <option value="일식">일식</option>
        <option value="양식">양식</option>
        <option value="카페">카페</option>
      </select>
      <label for="priceSelect">가격대:</label>
      <select id="priceSelect">
        <option value="">전체</option>
        <option value="저렴">저렴</option>
        <option value="중간">중간</option>
        <option value="고급">고급</option>
      </select>
      <button id="filterBtn">필터 적용</button>
      <button id="viewportBtn">현재 지도 화면에서 맛집 검색</button>
      <label style="margin-left:8px;"><input type="checkbox" id="autoViewport"> 지도 이동/확대 시 자동 검색</label>
      <span id="resultCount" style="margin-left:8px; color:#2563eb;"></span>
    </div>

    <!-- 지도 -->
    <div id="map" style="width:100%;height:500px;"></div>

    <!-- 주변 길거리 음식/카페 -->
    <div class="section">
      <button id="showFoodieBtn">주변 길거리 음식/카페 보기</button>
    </div>

    <!-- 경로 안내 정보 표시 -->
    <!-- 선택한 맛집 상세 정보 -->
    <div id="restaurantInfo" class="section"></div>

    <div id="routeInfo" class="section"></div>
  </div>
   <script src="js/main.js"></script>
</body>
</html>
